<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Projet Écologique</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <meta name="description" content="Connectez-vous à votre compte utilisateur.">
    <style>
        .switch-bubble {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(158, 179, 132, 0.1);
            color: var(--color-accent);
            padding: 5px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .switch-bubble:hover {
            background: var(--color-accent);
            color: white;
        }
    </style>
</head>

<body>

    <div class="auth-wrapper">
        <div class="card">
            <div class="card-header">
                <h2>Bon retour</h2>
                <p>Veuillez vous connecter pour continuer</p>
            </div>

            <!-- Note: Action pointe vers le contrôleur PHP loginClient -->
            <form action="../Controller/UserController.php?action=loginClient" method="POST" novalidate>
                <div class="form-group">
                    <label for="email">Adresse Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="exemple@domaine.com">
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••">
                    <div style="text-align: right; margin-top: 5px;">
                        <a href="forgot_password_client.html" style="font-size: 0.85rem; color: var(--color-accent); text-decoration: none;">Mot de passe oublié ?</a>
                    </div>
                </div>

                <button type="submit" class="btn btn-accent">Se connecter</button>
            </form>

            <div class="auth-footer">
                <p>Nouveau ici ? <a href="register.html">Créer un compte</a></p>
                <div style="margin-top: 15px;">
                    <a href="login_admin.html" class="btn btn-outline" style="padding: 10px; display: inline-block; width: 100%; box-sizing: border-box;">⚙️ Se connecter en tant qu'Administrateur</a>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/validation.js"></script>
</body>

</html>
