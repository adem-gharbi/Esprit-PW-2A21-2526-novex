<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil | Projet Écologique</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <meta name="description" content="Aperçu de vos coordonnées et détails de profil.">
</head>

<body>

    <div class="auth-wrapper profile-wrapper">
        <div class="card">
            <div class="card-header">
                <div class="profile-avatar">J</div>
                <h2>John Doe</h2>
                <p>Membre Écologique</p>
            </div>

            <div class="profile-info">
                <div class="info-group">
                    <span class="info-label">Nom complet</span>
                    <span class="info-value">John Doe</span>
                </div>

                <div class="info-group">
                    <span class="info-label">Adresse Email</span>
                    <span class="info-value">john.doe@exemple.com</span>
                </div>

                <div class="info-group">
                    <span class="info-label">Date de naissance</span>
                    <span class="info-value">15 Mai 1995</span>
                </div>

                <div class="info-group">
                    <span class="info-label">Date d'inscription</span>
                    <span class="info-value">6 Avril 2026</span>
                </div>

                <div class="info-group">
                    <span class="info-label">Statut du compte</span>
                    <span class="info-value" style="color: var(--color-accent); font-weight: bold;">Actif</span>
                </div>
            </div>

            <div class="profile-actions">
                <button class="btn btn-outline" style="flex: 1;">Modifier le profil</button>
                <a href="login.html" class="btn btn-accent" style="flex: 1;">Déconnexion</a>
            </div>
        </div>
    </div>

</body>

</html>
